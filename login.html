<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Equb</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #111827, #243b55);
    }

    .box {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 35px 25px;
      border-radius: 18px;
      box-shadow: 0 15px 40px rgba(0,0,0,.25);
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
      color: #111827;
    }

    .subtitle {
      text-align: center;
      color: #667085;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 17px;
      border: 1px solid #d0d5dd;
      border-radius: 9px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #f5b942;
      color: #111827;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
    }

    .links {
      text-align: center;
      margin-top: 20px;
    }

    .links a {
      color: #111827;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>💰 Equb</h1>

    <p class="subtitle">
      Login to your account
    </p>

    <form id="loginForm">

      <label for="email">Email</label>

      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <label for="password">Password</label>

      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        required
      >

      <button id="loginBtn" type="submit">
        Login
      </button>

      <div id="message"></div>

    </form>

    <div class="links">
      Don't have an account?
      <a href="register.html">Create Account</a>
    </div>

    <div class="links">
      <a href="index.html">← Back to Home</a>
    </div>

  </div>


  <script type="module">

    import {
      getAuth,
      signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

    import { app } from "./firebase-config.js";

    const auth = getAuth(app);

    const form =
      document.getElementById("loginForm");

    const button =
      document.getElementById("loginBtn");

    const message =
      document.getElementById("message");


    form.addEventListener("submit", async (e) => {

      e.preventDefault();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      button.disabled = true;
      button.textContent = "Logging in...";
      message.textContent = "";

      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

        message.style.color = "green";
        message.textContent =
          "✅ Login successful!";

        /*
          IMPORTANT:
          Go directly to dashboard.html
        */

        setTimeout(() => {

          window.location.replace(
            "./dashboard.html"
          );

        }, 500);

      } catch (error) {

        console.error(error);

        message.style.color = "red";

        message.textContent =
          "❌ Incorrect email or password.";

        button.disabled = false;
        button.textContent = "Login";

      }

    });

  </script>

</body>
</html>
