<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Login | Equb</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(
        135deg,
        #111827,
        #243b55
      );
    }

    .box {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 32px 25px;
      border-radius: 18px;
      box-shadow: 0 15px 40px rgba(0,0,0,.25);
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #667085;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 17px;
      border: 1px solid #d0d5dd;
      border-radius: 9px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #f5b942;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #f5b942;
      color: #111827;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
    }

    .links {
      text-align: center;
      margin-top: 20px;
      line-height: 2;
    }

    .links a {
      color: #111827;
      text-decoration: none;
      font-weight: bold;
    }

  </style>

</head>


<body>

  <div class="box">

    <div class="logo">
      💰 Equb
    </div>

    <p class="subtitle">
      Welcome back
    </p>


    <form id="loginForm">

      <label for="email">
        Email
      </label>

      <input
        id="email"
        type="email"
        placeholder="Enter your email"
        required>


      <label for="password">
        Password
      </label>

      <input
        id="password"
        type="password"
        placeholder="Enter your password"
        required>


      <button
        id="loginBtn"
        type="submit">

        Login

      </button>


      <div id="message"></div>

    </form>


    <div class="links">

      Don't have an account?

      <a href="register.html">
        Create Account
      </a>

      <br>

      <a href="index.html">
        ← Back to Home
      </a>

    </div>

  </div>


  <script type="module">

    import {
      getAuth,
      signInWithEmailAndPassword
    }
    from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";


    import {
      app
    }
    from "./firebase-config.js";


    const auth = getAuth(app);


    const form =
      document.getElementById("loginForm");

    const button =
      document.getElementById("loginBtn");

    const message =
      document.getElementById("message");


    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const email =
          document
            .getElementById("email")
            .value
            .trim();


        const password =
          document
            .getElementById("password")
            .value;


        button.disabled = true;

        button.textContent =
          "Logging in...";

        message.textContent = "";


        try {

          const result =
            await signInWithEmailAndPassword(
              auth,
              email,
              password
            );


          console.log(
            "Logged in:",
            result.user.email
          );


          message.style.color =
            "green";

          message.textContent =
            "✅ Login successful!";


          /*
            IMPORTANT:
            Open dashboard directly.
          */

          await new Promise(
            resolve =>
              setTimeout(resolve, 500)
          );


          window.location.href =
            "dashboard.html";


        } catch (error) {

          console.error(error);

          message.style.color =
            "red";

          message.textContent =
            "❌ Login failed. Check your email and password.";

          button.disabled = false;

          button.textContent =
            "Login";

        }

      }

    );

  </script>

</body>

</html>
