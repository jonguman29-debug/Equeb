<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Members - Digital Equb</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      color: #172033;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 21px;
      font-weight: bold;
    }

    .back {
      color: white;
      text-decoration: none;
      background: #374151;
      padding: 9px 14px;
      border-radius: 8px;
    }

    .container {
      max-width: 1150px;
      margin: auto;
      padding: 25px 20px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
    }

    .top h1 {
      font-size: 28px;
    }

    .add-btn {
      border: none;
      background: #f5b942;
      color: #111827;
      padding: 12px 18px;
      border-radius: 9px;
      font-weight: bold;
      cursor: pointer;
    }

    .search {
      width: 100%;
      padding: 13px;
      border: 1px solid #d0d5dd;
      border-radius: 9px;
      margin-bottom: 20px;
      font-size: 16px;
      outline: none;
    }

    .table-box {
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 5px 18px rgba(0,0,0,0.06);
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 750px;
    }

    th,
    td {
      padding: 14px 10px;
      text-align: left;
      border-bottom: 1px solid #eee;
    }

    th {
      color: #667085;
      font-size: 13px;
    }

    .status {
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .active {
      background: #dcfce7;
      color: #166534;
    }

    .unpaid {
      background: #fee2e2;
      color: #b91c1c;
    }

    .actions button {
      border: none;
      padding: 7px 10px;
      border-radius: 6px;
      cursor: pointer;
      margin-right: 4px;
    }

    .edit {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .delete {
      background: #fee2e2;
      color: #b91c1c;
    }

    /* Modal */

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-box {
      background: white;
      width: 100%;
      max-width: 420px;
      padding: 25px;
      border-radius: 15px;
    }

    .modal-box h2 {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #d0d5dd;
      border-radius: 8px;
      font-size: 15px;
    }

    .save {
      width: 100%;
      border: none;
      background: #111827;
      color: white;
      padding: 13px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .close {
      width: 100%;
      border: none;
      background: #eee;
      color: #333;
      padding: 13px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    @media (max-width: 600px) {
      .top {
        align-items: flex-start;
        flex-direction: column;
      }

      .add-btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <header>

    <div class="logo">
      👑 Digital Equb
    </div>

    <a href="admin.html" class="back">
      ← Admin
    </a>

  </header>

  <main class="container">

    <div class="top">

      <h1>👥 Members</h1>

      <button class="add-btn" onclick="openModal()">
        ➕ Add Member
      </button>

    </div>

    <input
      type="text"
      id="search"
      class="search"
      placeholder="Search member by name, ID or phone..."
      onkeyup="searchMembers()"
    >

    <div class="table-box">

      <table id="membersTable">

        <thead>

          <tr>
            <th>Member ID</th>
            <th>Name</th>
            <th>Phone</th>
            <th>Contribution</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>

        </thead>

        <tbody>

          <tr>
            <td>EQB-001</td>
            <td>Abebe</td>
            <td>0911111111</td>
            <td>1,000 ETB</td>
            <td>
              <span class="status active">Active</span>
            </td>
            <td class="actions">
              <button class="edit" onclick="editMember('EQB-001')">
                Edit
              </button>

              <button class="delete" onclick="deleteMember(this)">
                Delete
              </button>
            </td>
          </tr>

          <tr>
            <td>EQB-002</td>
            <td>Meron</td>
            <td>0922222222</td>
            <td>1,000 ETB</td>
            <td>
              <span class="status unpaid">Unpaid</span>
            </td>
            <td class="actions">
              <button class="edit" onclick="editMember('EQB-002')">
                Edit
              </button>

              <button class="delete" onclick="deleteMember(this)">
                Delete
              </button>
            </td>
          </tr>

          <tr>
            <td>EQB-003</td>
            <td>Dawit</td>
            <td>0933333333</td>
            <td>1,000 ETB</td>
            <td>
              <span class="status active">Active</span>
            </td>
            <td class="actions">
              <button class="edit" onclick="editMember('EQB-003')">
                Edit
              </button>

              <button class="delete" onclick="deleteMember(this)">
                Delete
              </button>
            </td>
          </tr>

        </tbody>

      </table>

    </div>

  </main>

  <!-- Add Member Modal -->

  <div class="modal" id="memberModal">

    <div class="modal-box">

      <h2>➕ Add New Member</h2>

      <form onsubmit="addMember(event)">

        <label>Full Name</label>
        <input
          type="text"
          id="memberName"
          placeholder="Full name"
          required
        >

        <label>Phone Number</label>
        <input
          type="tel"
          id="memberPhone"
          placeholder="Phone number"
          required
        >

        <label>Monthly Contribution</label>
        <input
          type="number"
          id="memberAmount"
          placeholder="Amount in ETB"
          required
        >

        <button class="save" type="submit">
          Save Member
        </button>

        <button
          type="button"
          class="close"
          onclick="closeModal()"
        >
          Cancel
        </button>

      </form>

    </div>

  </div>

  <script>

    function openModal() {
      document.getElementById("memberModal").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("memberModal").style.display = "none";
    }

    function addMember(event) {

      event.preventDefault();

      const name =
        document.getElementById("memberName").value;

      const phone =
        document.getElementById("memberPhone").value;

      const amount =
        document.getElementById("memberAmount").value;

      const table =
        document.querySelector("#membersTable tbody");

      const id =
        "EQB-" +
        String(table.rows.length + 1).padStart(3, "0");

      const row = table.insertRow();

      row.innerHTML = `
        <td>${id}</td>
        <td>${name}</td>
        <td>${phone}</td>
        <td>${Number(amount).toLocaleString()} ETB</td>
        <td>
          <span class="status active">
            Active
          </span>
        </td>
        <td class="actions">

          <button
            class="edit"
            onclick="editMember('${id}')">
            Edit
          </button>

          <button
            class="delete"
            onclick="deleteMember(this)">
            Delete
          </button>

        </td>
      `;

      closeModal();

      document.querySelector("form").reset();
    }

    function deleteMember(button) {

      const confirmDelete =
        confirm("Are you sure you want to delete this member?");

      if (confirmDelete) {
        button.closest("tr").remove();
      }
    }

    function editMember(id) {

      alert(
        "Edit member " +
        id +
        " will be connected to the database later."
      );
    }

    function searchMembers() {

      const input =
        document.getElementById("search").value.toLowerCase();

      const rows =
        document.querySelectorAll("#membersTable tbody tr");

      rows.forEach(row => {

        const text =
          row.innerText.toLowerCase();

        row.style.display =
          text.includes(input) ? "" : "none";

      });
    }

  </script>

</body>
        </html>
