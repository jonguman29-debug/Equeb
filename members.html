<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Members | Equb</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    header {
      background: #111827;
      color: white;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
    }

    .back {
      color: white;
      text-decoration: none;
      background: #374151;
      padding: 9px 14px;
      border-radius: 8px;
    }

    main {
      max-width: 1000px;
      margin: auto;
      padding: 25px 20px 50px;
    }

    .title-box {
      background: linear-gradient(135deg, #111827, #243b55);
      color: white;
      padding: 28px 22px;
      border-radius: 18px;
      margin-bottom: 25px;
    }

    .title-box h1 {
      margin-bottom: 8px;
    }

    .title-box p {
      color: #dbe3ef;
    }

    .count {
      margin-top: 12px;
      font-weight: bold;
      color: #f5b942;
    }

    .members {
      display: grid;
      grid-template-columns: repeat(
        auto-fit,
        minmax(250px, 1fr)
      );
      gap: 18px;
    }

    .member {
      background: white;
      padding: 22px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,.07);
    }

    .avatar {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      background: #f5b942;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .member h3 {
      margin-bottom: 7px;
    }

    .email {
      color: #667085;
      font-size: 14px;
      word-break: break-word;
      margin-bottom: 12px;
    }

    .status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      background: #dcfce7;
      color: #166534;
      font-size: 12px;
      font-weight: bold;
    }

    .loading,
    .empty,
    .error {
      background: white;
      padding: 30px;
      text-align: center;
      border-radius: 15px;
      color: #667085;
    }

    .error {
      color: #b91c1c;
    }

    footer {
      text-align: center;
      padding: 25px;
      background: #111827;
      color: #9ca3af;
    }

    @media (max-width: 600px) {
      main {
        padding: 18px 14px 40px;
      }

      .logo {
        font-size: 19px;
      }
    }
  </style>
</head>

<body>

  <header>

    <div class="logo">
      💰 Equb
    </div>

    <a
      href="dashboard.html"
      class="back">
      ← Dashboard
    </a>

  </header>


  <main>

    <section class="title-box">

      <h1>👥 Equb Members</h1>

      <p>
        View all registered members of your Digital Equb.
      </p>

      <div
        class="count"
        id="memberCount">
        Members: 0
      </div>

    </section>


    <section
      class="members"
      id="membersList">

      <div class="loading">
        Loading members...
      </div>

    </section>

  </main>


  <footer>
    © 2026 Equb. All rights reserved.
  </footer>


  <script type="module">

    import {
      collection,
      getDocs
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

    import {
      db
    } from "./firebase-config.js";


    const membersList =
      document.getElementById("membersList");

    const memberCount =
      document.getElementById("memberCount");


    async function loadMembers() {

      try {

        const snapshot =
          await getDocs(
            collection(db, "users")
          );


        membersList.innerHTML = "";

        let total = 0;


        snapshot.forEach((doc) => {

          const user = doc.data();

          total++;


          const name =
            user.name || "Member";

          const email =
            user.email || "No email";

          const firstLetter =
            name.charAt(0).toUpperCase();


          const card =
            document.createElement("div");

          card.className = "member";


          card.innerHTML = `

            <div class="avatar">
              ${firstLetter}
            </div>

            <h3>
              ${name}
            </h3>

            <div class="email">
              ${email}
            </div>

            <span class="status">
              ${user.status || "active"}
            </span>

          `;


          membersList.appendChild(card);

        });


        memberCount.textContent =
          "Members: " + total;


        if (total === 0) {

          membersList.innerHTML = `
            <div class="empty">
              No members found.
            </div>
          `;

        }


      } catch (error) {

        console.error(error);

        membersList.innerHTML = `
          <div class="error">
            ❌ Could not load members.
            <br><br>
            Please check your Firebase settings.
          </div>
        `;

      }

    }


    loadMembers();

  </script>

</body>
</html>
