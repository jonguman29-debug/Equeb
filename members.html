<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Members | Equb</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    header {
      background: #111827;
      color: white;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
    }

    .back {
      color: white;
      text-decoration: none;
      background: #374151;
      padding: 9px 14px;
      border-radius: 8px;
    }

    main {
      max-width: 1000px;
      margin: auto;
      padding: 25px 20px 50px;
    }

    .title {
      background: linear-gradient(135deg, #111827, #243b55);
      color: white;
      padding: 28px 22px;
      border-radius: 17px;
      margin-bottom: 22px;
    }

    .title h1 {
      margin-bottom: 8px;
    }

    .title p {
      color: #dbe3ef;
    }

    .add-box,
    .members-box {
      background: white;
      padding: 22px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,.07);
      margin-bottom: 20px;
    }

    .add-box h2,
    .members-box h2 {
      margin-bottom: 18px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 13px;
      border: 1px solid #d0d5dd;
      border-radius: 9px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #f5b942;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 9px;
      background: #f5b942;
      color: #111827;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
    }

    #message {
      text-align: center;
      margin-top: 12px;
      font-weight: bold;
    }

    .member-list {
      display: grid;
      gap: 12px;
    }

    .member {
      display: grid;
      grid-template-columns: 50px 1fr auto;
      align-items: center;
      gap: 15px;
      padding: 15px;
      border: 1px solid #eef0f4;
      border-radius: 12px;
    }

    .avatar {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: #f5b942;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 18px;
    }

    .name {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .email {
      color: #667085;
      font-size: 13px;
      word-break: break-word;
    }

    .count {
      background: #111827;
      color: white;
      padding: 7px 11px;
      border-radius: 20px;
      font-size: 13px;
    }

    .empty,
    .loading {
      text-align: center;
      padding: 25px;
      color: #667085;
    }

    footer {
      background: #111827;
      color: #9ca3af;
      text-align: center;
      padding: 25px;
    }

    @media (max-width: 600px) {
      .member {
        grid-template-columns: 45px 1fr;
      }

      .count {
        grid-column: 2;
        width: fit-content;
      }
    }
  </style>
</head>


<body>

  <header>

    <div class="logo">
      💰 Equb
    </div>

    <a
      href="dashboard.html"
      class="back">
      ← Dashboard
    </a>

  </header>


  <main>

    <section class="title">

      <h1>
        👥 Equb Members
      </h1>

      <p>
        Manage the members of your Equb.
      </p>

    </section>


    <section class="add-box">

      <h2>
        ➕ Add Member
      </h2>

      <form id="memberForm">

        <input
          type="text"
          id="name"
          placeholder="Member name"
          required>

        <input
          type="email"
          id="email"
          placeholder="Member email"
          required>

        <button
          id="addBtn"
          type="submit">
          Add Member
        </button>

      </form>

      <div id="message"></div>

    </section>


    <section class="members-box">

      <h2>
        📋 Members
      </h2>

      <div
        id="memberList"
        class="member-list">

        <div class="loading">
          Loading members...
        </div>

      </div>

    </section>

  </main>


  <footer>
    © 2026 Equb. All rights reserved.
  </footer>


  <script type="module">

    import {
      getAuth,
      onAuthStateChanged
    }
    from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";


    import {
      collection,
      addDoc,
      getDocs,
      serverTimestamp
    }
    from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


    import {
      app,
      db
    }
    from "./firebase-config.js";


    const auth = getAuth(app);


    const form =
      document.getElementById("memberForm");

    const addBtn =
      document.getElementById("addBtn");

    const message =
      document.getElementById("message");

    const memberList =
      document.getElementById("memberList");


    onAuthStateChanged(
      auth,
      (user) => {

        if (!user) {

          window.location.replace(
            "login.html"
          );

        }

      }
    );


    async function loadMembers() {

      try {

        const snapshot =
          await getDocs(
            collection(db, "users")
          );


        memberList.innerHTML = "";


        if (snapshot.empty) {

          memberList.innerHTML = `
            <div class="empty">
              No members yet.
            </div>
          `;

          return;
        }


        let number = 0;


        snapshot.forEach(
          (docItem) => {

            const data =
              docItem.data();

            number++;


            const name =
              data.name || "Member";

            const email =
              data.email || "No email";


            const member =
              document.createElement("div");

            member.className =
              "member";


            member.innerHTML = `

              <div class="avatar">
                ${name
                  .charAt(0)
                  .toUpperCase()}
              </div>

              <div>

                <div class="name">
                  ${name}
                </div>

                <div class="email">
                  ${email}
                </div>

              </div>

              <div class="count">
                #${number}
              </div>

            `;


            memberList.appendChild(
              member
            );

          }
        );


      } catch (error) {

        console.error(error);

        memberList.innerHTML = `
          <div class="empty">
            ❌ Unable to load members.
          </div>
        `;

      }

    }


    form.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();


        const name =
          document
            .getElementById("name")
            .value
            .trim();

        const email =
          document
            .getElementById("email")
            .value
            .trim();


        addBtn.disabled = true;

        addBtn.textContent =
          "Adding...";

        message.textContent = "";


        try {

          await addDoc(
            collection(db, "users"),
            {
              name: name,
              email: email,
              contribution: 0,
              createdAt:
                serverTimestamp()
            }
          );


          message.style.color =
            "green";

          message.textContent =
            "✅ Member added successfully!";


          form.reset();


          await loadMembers();


        } catch (error) {

          console.error(error);

          message.style.color =
            "red";

          message.textContent =
            "❌ Could not add member.";

        }


        addBtn.disabled = false;

        addBtn.textContent =
          "Add Member";

      }
    );


    loadMembers();

  </script>

</body>

</html>
