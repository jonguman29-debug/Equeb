<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Contributions | Equb</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    header {
      background: #111827;
      color: white;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
    }

    .back {
      color: white;
      text-decoration: none;
      background: #374151;
      padding: 9px 14px;
      border-radius: 8px;
    }

    main {
      max-width: 1050px;
      margin: auto;
      padding: 25px 20px 50px;
    }

    .hero {
      background: linear-gradient(135deg, #111827, #243b55);
      color: white;
      padding: 30px 22px;
      border-radius: 18px;
      margin-bottom: 22px;
    }

    .hero h1 {
      margin-bottom: 8px;
    }

    .hero p {
      color: #dbe3ef;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(
        auto-fit,
        minmax(200px, 1fr)
      );
      gap: 15px;
      margin-bottom: 22px;
    }

    .summary-card {
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,.07);
    }

    .summary-card .icon {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .summary-card .label {
      color: #667085;
      font-size: 14px;
    }

    .summary-card .value {
      font-size: 25px;
      font-weight: bold;
      margin-top: 6px;
    }

    .box {
      background: white;
      padding: 22px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,.07);
      margin-bottom: 20px;
    }

    .box h2 {
      margin-bottom: 18px;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      margin-bottom: 13px;
      border: 1px solid #d0d5dd;
      border-radius: 9px;
      font-size: 16px;
      background: white;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #f5b942;
      color: #111827;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #message {
      text-align: center;
      margin-top: 12px;
      font-weight: bold;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 600px;
    }

    th,
    td {
      padding: 14px 10px;
      text-align: left;
      border-bottom: 1px solid #eef0f4;
    }

    th {
      background: #f8fafc;
      font-size: 14px;
    }

    td {
      font-size: 14px;
    }

    .paid {
      color: #166534;
      font-weight: bold;
    }

    .amount {
      font-weight: bold;
    }

    .empty,
    .loading {
      text-align: center;
      padding: 25px;
      color: #667085;
    }
